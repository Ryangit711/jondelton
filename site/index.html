<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jon Elton – Home</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .hero { text-align: center; padding: 8rem 2rem; }
    .hero h1 { font-size: 2.8rem; }
    .hero p { font-size: 1.2rem; margin-top: .5rem; }
  </style>
</head>
<body>
  <div class="bg-anim"><div class="grad"></div></div>
  <section class="hero">
    <h1>Jon Elton</h1>
    <p>Thoughts, poems, and little life gems – delivered straight to your inbox.</p>
    <a href="gems.html"><button>Read the Gems Archive</button></a>
  </section>

  <section id="newsletter">
    <h2>Subscribe to Jon’s Gems</h2>
    <form action="https://YOUR_MAILERLITE_FORM_URL" method="POST" target="_blank">
      <input type="email" name="email" placeholder="you@example.com" required>
      <input type="submit" value="Subscribe">
    </form>
    <p>Free, no spam, just a monthly bite of inspiration.</p>
  </section>

  <section id="contact">
    <h2>Send a quick note</h2>
    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <input type="email" name="email" placeholder="your email" required><br><br>
      <textarea name="message" rows="4" placeholder="Your message" required style="width:100%;max-width:400px;"></textarea><br><br>
      <input type="submit" value="Send">
    </form>
  </section>

  <!-- floating orbs and notes for visual flair -->
  <div class="orb one"></div>
  <div class="orb two"></div>
  <div class="orb three"></div>
  <div class="note n1"></div>
  <div class="note n2"></div>
  <div class="note n3"></div>
  <div class="note n4"></div>
  <div class="note n5"></div>
  <div class="note n6"></div>

</body>
</html>
